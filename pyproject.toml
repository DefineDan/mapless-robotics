[project]
name = "mapless-robotics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "habitat-sim",
    "hdbscan>=0.8.44",
    "lotis",
    "rerun-sdk>=0.38,<0.39",
    "segmentation-models-pytorch==0.3.3",
    "setuptools<81",
]

[project.scripts]
mapless-robotics = "mapless_robotics:main"

[build-system]
requires = ["uv_build>=0.7.10,<0.8"]
build-backend = "uv_build"

[tool.uv.sources]
lotis = { path = "external/lotis", editable = true }
habitat-sim = { workspace = true, editable = true }

[tool.uv.workspace]
members = [
    "external/habitat-sim",
]
